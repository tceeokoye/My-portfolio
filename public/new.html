<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
.section3Flex {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  padding: 0 60px;
  gap: 220px;
  width: 100%;
  box-sizing: border-box;
}

.sub {
  padding-left: 77px;
  width: 50%;
  display: flex;
  flex-direction: column;
}

.sub1 {
  padding-right: 77px;
  width: 50%;
  display: flex;
  flex-direction: column;
}

.subA1, .subA2 {
  width: 100%;
}

.html {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  width: 100%;
  margin-top: 55px;
}

.language {
  font-family: "Inter", sans-serif;
  font-size: 24px;
  font-weight: 400;
  text-align: left;
  color: black;
}

.perc {
  font-family: "Inter", sans-serif;
  font-size: 24px;
  font-weight: 400;
  color: black;
  text-align: right;
}

.percentage {
  width: 0%; /* Start with 0% width for animation */
  height: 6px;
  background: #ffd054;
  margin-top: 6px;
  transition: width 1s ease-out; /* Smooth animation for width */
}

/* Custom background colors (optional) */
.percentage1 {
  background: #4caf50;
}

.percentage2 {
  background: #2196f3;
}

.percentage3 {
  background: #ff9800;
}


</style>
<body>
  <section>
    <div class="section3Flex">
      <div class="sub subA">
        <div class="subA1">
          <div class="html">
            <h1 class="language lang1">HTML</h1>
            <p class="perc">90%</p>
          </div>
          <div class="percentage"></div>
        </div>
        <div class="subA1">
          <div class="html a1">
            <h1 class="language lang1">CSS</h1>
            <p class="perc">80%</p>
          </div>
          <div class="percentage percentage1"></div>
        </div>
      </div>
      <div class="sub1">
        <div class="subA2">
          <div class="html">
            <h1 class="language lang1">JavaScript</h1>
            <p class="perc">75%</p>
          </div>
          <div class="percentage percentage2"></div>
        </div>
        <div class="subA2">
          <div class="html a2">
            <h1 class="language lang1">React.js</h1>
            <p class="perc">60%</p>
          </div>
          <div class="percentage percentage3"></div>
        </div>
      </div>
    </div>
  </section>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
  const skills = [
    { selector: ".percentage", value: 90 },
    { selector: ".percentage1", value: 80 },
    { selector: ".percentage2", value: 70 },
    { selector: ".percentage3", value: 60 },
  ];

  // Function to animate the progress bars and percentages
  const animateProgress = () => {
    skills.forEach((skill) => {
      const element = document.querySelector(skill.selector);
      const percentageText = element.previousElementSibling.querySelector(".perc");
      const targetValue = skill.value;

      // Animate the width
      element.style.transition = "width 1s ease-out"; // Smooth transition for width
      element.style.width = `${targetValue}%`;

      // Animate the percentage text
      let currentPercentage = 0;
      const updateInterval = 1000 / targetValue; // Time per percentage increment
      const interval = setInterval(() => {
        if (currentPercentage <= targetValue) {
          percentageText.textContent = `${currentPercentage}%`;
          currentPercentage++;
        } else {
          clearInterval(interval);
        }
      }, updateInterval);
    });
  };

  // Intersection Observer to trigger the animation when the section is visible
  const section = document.querySelector(".section3Flex");
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          animateProgress(); // Start animation
          observer.unobserve(section); // Stop observing after the animation starts
        }
      });
    },
    { threshold: 0.5 } // Trigger when 50% of the section is visible
  );

  observer.observe(section); // Observe the section
});

  </script>
</body>
</html>
